<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Запоминалка: русский язык, ЕГЭ</title>
<meta name="description" content="Тренажёр для ЕГЭ по русскому языку: ударения, приставки пре- и при-, словарные слова.">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Запоминалка">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<script>
// тема ставится до отрисовки, чтобы страница не мигала
try { var t = JSON.parse(localStorage.getItem('egeru_theme')); if (t === 'dark') document.documentElement.dataset.theme = 'dark'; } catch (e) {}
</script>
<style>
/*FONTS*/
:root {
  --paper: #ffffff;
  --ink: #15171c;
  --soft: #a3a8b3;        /* согласные в слове с ударением */
  --muted: #747a87;
  --line: #e6e8ec;
  --line-strong: #c9cdd5;
  --wash: #f4f5f7;
  --pen: #2a45e8;         /* синяя ручка: всё, что отметил ученик */
  --pen-wash: #eef1fe;
  --ok: #128a49;
  --ok-wash: #e7f5ec;
  --bad: #d3352b;
  --bad-wash: #fcebe9;
  --ui: "Golos Text", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --word: "Literata", Georgia, "Times New Roman", serif;
  color-scheme: light;
}
[data-theme="dark"] {
  --paper: #0f1115;
  --ink: #eceef2;
  --soft: #5d6370;
  --muted: #8b92a0;
  --line: #242831;
  --line-strong: #3a404c;
  --wash: #181b21;
  --pen: #8a9bff;
  --pen-wash: #1b2040;
  --ok: #4ccb86;
  --ok-wash: #11281c;
  --bad: #ff7669;
  --bad-wash: #331614;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--paper); color: var(--ink); }
body {
  font: 400 16px/1.45 var(--ui);
  min-height: 100dvh;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);
  -webkit-font-smoothing: antialiased;
  transition: background-color .2s, color .2s;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:focus-visible, [role="switch"]:focus-visible { outline: 2px solid var(--pen); outline-offset: 3px; border-radius: 8px; }
h1, h2, p { margin: 0; }
[hidden] { display: none !important; }

.app { max-width: 560px; margin: 0 auto; padding: 20px 22px calc(var(--bar-h, 96px) + 28px); }

/* ---------- шапка ---------- */
.mast { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
.mast h1 { font: 600 22px/1.2 var(--ui); letter-spacing: -.015em; }
.mast p { color: var(--muted); font-size: 14px; margin-top: 2px; }
.icon-btn { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: var(--ink); border: 1px solid var(--line); flex: none; transition: background-color .15s; }
.icon-btn:hover { background: var(--wash); }
.icon-btn svg { width: 18px; height: 18px; }
[data-theme="light"] .i-sun, [data-theme="dark"] .i-moon { display: none; }

/* ---------- вкладки ---------- */
.tabs { display: flex; gap: 22px; margin-top: 26px; border-bottom: 1px solid var(--line); }
.tabs button { position: relative; padding: 10px 0 12px; font-size: 16px; color: var(--muted); white-space: nowrap; transition: color .15s; }
.tabs button[aria-selected="true"] { color: var(--ink); font-weight: 600; }
.tabs button[aria-selected="true"]::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--ink); }

/* ---------- слово ---------- */
.word { font-family: var(--word); font-weight: 500; line-height: 1.3; letter-spacing: .005em; white-space: nowrap; }
.word .k { color: var(--soft); }
.word .v { position: relative; display: inline-block; color: var(--ink); font: inherit; padding: .5em 0 .25em; margin: -.5em 0 -.25em; transition: color .12s; }
.word .v.acc { color: var(--pen); }
.word .v.acc::before {                      /* знак ударения, как в словаре */
  content: ""; position: absolute; left: 50%; top: .52em; width: .075em; height: .25em; margin-left: -.01em;
  background: currentColor; border-radius: .04em; transform: rotate(24deg); transform-origin: 50% 100%;
  animation: stroke .14s ease-out;
}
@keyframes stroke { from { transform: rotate(24deg) scaleY(0); } }
.word .v.ok { color: var(--ok); }
.word .v.bad { color: var(--bad); }
.word .slot { display: inline-block; min-width: .64em; margin: 0 .05em; text-align: center; color: var(--pen); font: inherit; line-height: 1.12;
  border-bottom: .055em solid var(--line-strong); border-radius: .08em .08em 0 0; padding: 0 .03em; transition: border-color .12s, background-color .12s; }
.word .slot.on { border-bottom-color: var(--pen); background: var(--pen-wash); }
.word .slot.ok { color: var(--ok); border-bottom-color: var(--ok); background: none; }
.word .slot.bad { color: var(--bad); border-bottom-color: var(--bad); background: none; text-decoration: line-through; text-decoration-thickness: .05em; }
.word .par { font-family: var(--ui); font-weight: 400; font-size: .5em; color: var(--muted); }

/* ---------- главная ---------- */
.sample { margin-top: 30px; font-size: 54px; }
.lead { margin-top: 6px; color: var(--muted); max-width: 30em; }
.stats { margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--line); color: var(--muted); font-size: 15px; font-variant-numeric: tabular-nums; }
.stats b { color: var(--ink); font-weight: 600; }
.block { margin-top: 30px; }
.block-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px; }
.block-head h2 { font: 600 15px/1.2 var(--ui); }
.link { color: var(--muted); font-size: 14px; text-decoration: underline; text-decoration-color: var(--line-strong); text-underline-offset: 3px; }
.link:hover { color: var(--ink); }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: baseline; gap: 7px; padding: 9px 15px; border-radius: 999px; border: 1px solid var(--line-strong); font-size: 15px; transition: background-color .15s, color .15s, border-color .15s; }
.chip small { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.chip[aria-pressed="true"] small { color: inherit; opacity: .6; }

.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 8px; }
.seg button { padding: 10px 4px 9px; border-radius: 14px; border: 1px solid var(--line-strong); text-align: center; line-height: 1.2; transition: background-color .15s, color .15s, border-color .15s; }
.seg b { display: block; font-size: 19px; font-weight: 600; font-variant-numeric: tabular-nums; }
.seg small { display: block; font-size: 12.5px; color: var(--muted); min-height: 15px; }
.seg button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.seg button[aria-pressed="true"] small { color: inherit; opacity: .6; }

.rows { border-top: 1px solid var(--line); }
.row { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 0; border-bottom: 1px solid var(--line); width: 100%; text-align: left; }
.row span { display: block; }
.row .t { font-size: 16px; }
.row .d { font-size: 13.5px; color: var(--muted); }
.sw { flex: none; width: 46px; height: 28px; border-radius: 999px; background: var(--line-strong); position: relative; transition: background-color .18s; }
.sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--paper); transition: transform .18s; }
.row[aria-checked="true"] .sw { background: var(--ink); }
.row[aria-checked="true"] .sw::after { transform: translateX(18px); }
.foot { margin-top: 26px; display: flex; flex-direction: column; gap: 14px; align-items: flex-start; }
.foot p { color: var(--muted); font-size: 13px; max-width: 34em; }

/* ---------- вопрос ---------- */
.qtop { display: flex; align-items: center; gap: 14px; }
.prog { flex: 1; height: 3px; border-radius: 3px; background: var(--line); overflow: hidden; }
.prog i { display: block; height: 100%; width: 0; background: var(--ink); transition: width .25s; }
.count { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; min-width: 58px; text-align: right; }
.stage { padding-top: min(13vh, 110px); text-align: center; }
.kick { color: var(--muted); font-size: 14px; min-height: 21px; }
.kick.again { color: var(--pen); }
#word { margin-top: 10px; font-size: 60px; cursor: default; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
.ctx { color: var(--muted); font-size: 15px; min-height: 22px; margin-top: 2px; }
.fb { margin-top: 22px; min-height: 96px; }
.fb .ask { color: var(--muted); font-size: 15px; }
.fb .verdict { font-weight: 600; font-size: 17px; }
.fb.ok .verdict { color: var(--ok); }
.fb.bad .verdict { color: var(--bad); }
.fb .right { font: 500 24px/1.35 var(--word); margin-top: 4px; white-space: normal; }
.fb .right .v.ok, .fb .right b { color: var(--ok); font-weight: inherit; }
.fb .note { color: var(--muted); font-size: 14px; margin-top: 8px; }
.fb .note .word { font-size: 16px; white-space: normal; color: var(--ink); }
.fb .note .word b { color: var(--ok); font-weight: 600; }
@keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
.shake { animation: shake .32s; }

/* ---------- результат ---------- */
.score { margin-top: min(9vh, 70px); font: 600 60px/1.05 var(--ui); letter-spacing: -.03em; }
.score small { font: 400 16px/1.4 var(--ui); color: var(--muted); display: block; margin-top: 12px; letter-spacing: 0; }
.miss { margin-top: 34px; }
.miss h2 { font: 600 15px/1.2 var(--ui); padding-bottom: 10px; border-bottom: 1px solid var(--line); }
.miss li { list-style: none; padding: 11px 0; border-bottom: 1px solid var(--line); display: flex; align-items: baseline; justify-content: space-between; gap: 14px; }
.miss ul { margin: 0; padding: 0; }
.miss .word { font-size: 22px; white-space: normal; }
.miss .word b { color: var(--ok); font-weight: inherit; }
.miss span.c { color: var(--muted); font-size: 13.5px; text-align: right; }

/* ---------- нижняя панель ---------- */
.bar { position: fixed; left: 0; right: 0; bottom: 0; background: linear-gradient(to bottom, transparent, var(--paper) 22px); padding: 26px 22px calc(18px + env(safe-area-inset-bottom)); }
.bar-in { max-width: 516px; margin: 0 auto; }
.keys { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 12px; }
.keys.many { grid-template-columns: repeat(5, 1fr); gap: 8px; }
.key { height: 64px; border-radius: 16px; border: 1.5px solid var(--line-strong); font: 500 30px/1 var(--word); padding-bottom: 4px; background: var(--paper); transition: border-color .12s, background-color .12s, color .12s, transform .08s; }
.keys.many .key { height: 50px; font-size: 24px; border-radius: 13px; }
.key:active { transform: scale(.97); }
.key[aria-pressed="true"] { border-color: var(--pen); background: var(--pen-wash); color: var(--pen); }
.key.ok { border-color: var(--ok); background: var(--ok-wash); color: var(--ok); }
.key.bad { border-color: var(--bad); background: var(--bad-wash); color: var(--bad); }
.key:disabled { cursor: default; }
.key:disabled:not(.ok):not(.bad) { opacity: .4; }
.acts { display: flex; gap: 10px; }
.btn { flex: 1; height: 56px; border-radius: 16px; background: var(--ink); color: var(--paper); font: 600 17px/1 var(--ui); transition: opacity .15s, background-color .15s; }
.btn:disabled { opacity: .22; cursor: default; }
.btn.ghost { flex: 0 0 auto; padding: 0 20px; background: none; color: var(--ink); border: 1.5px solid var(--line-strong); }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
@media (max-width: 360px) { .app { padding-left: 16px; padding-right: 16px; } .tabs { gap: 16px; } .tabs button { font-size: 15px; } }
</style>
</head>
<body>
<div class="app">

<section id="home">
  <header class="mast">
    <div>
      <h1>Запоминалка</h1>
      <p>Русский язык, ЕГЭ</p>
    </div>
    <button class="icon-btn" id="themeBtn" aria-label="Переключить тему">
      <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
      <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>
    </button>
  </header>

  <nav class="tabs" role="tablist" id="tabs">
    <button role="tab" data-tab="udar">Ударения</button>
    <button role="tab" data-tab="prepri">Пре- и при-</button>
    <button role="tab" data-tab="slov">Словарные</button>
  </nav>

  <div class="sample word" id="sample" aria-hidden="true"></div>
  <p class="lead" id="lead"></p>
  <p class="stats" id="stats"></p>

  <div class="block" id="posBlock">
    <div class="block-head"><h2>Части речи</h2><button class="link" id="posAll"></button></div>
    <div class="chips" id="chips"></div>
  </div>

  <div class="block">
    <div class="block-head"><h2>Сколько слов</h2></div>
    <div class="seg" id="cnt"></div>
  </div>

  <div class="block rows">
    <button class="row" role="switch" id="swRepeat" aria-checked="true">
      <span><span class="t">Повторять ошибки</span><span class="d">слово с ошибкой вернётся через несколько слов</span></span><i class="sw"></i>
    </button>
    <button class="row" role="switch" id="swHard" aria-checked="false">
      <span><span class="t">Усложнённый режим</span><span class="d">на кнопках все гласные, а не пара букв</span></span><i class="sw"></i>
    </button>
  </div>

  <div class="foot">
    <button class="link" id="reset">Сбросить прогресс</button>
    <p>Слова взяты из трёх списков для подготовки к ЕГЭ: орфоэпический минимум, приставки пре- и при-, словарные слова ФИПИ. Буква «ё» в словах заменена на «е».</p>
  </div>
</section>

<section id="quiz" hidden>
  <div class="qtop">
    <button class="icon-btn" id="quit" aria-label="Закончить">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <div class="prog"><i id="progBar"></i></div>
    <span class="count" id="progTxt"></span>
  </div>
  <div class="stage">
    <p class="kick" id="kick"></p>
    <div class="word" id="word"></div>
    <p class="ctx" id="ctx"></p>
    <div class="fb" id="fb" aria-live="polite"></div>
  </div>
</section>

<section id="result" hidden>
  <header class="mast"><div><h1 id="rTitle"></h1><p>Результат</p></div></header>
  <p class="score" id="score"></p>
  <div class="miss" id="miss"><h2>Запомни эти слова</h2><ul id="missList"></ul></div>
</section>

</div>

<div class="bar" id="bar"><div class="bar-in">
  <div class="keys" id="keys" hidden></div>
  <div class="acts">
    <button class="btn ghost" id="back" hidden>На главную</button>
    <button class="btn" id="main">Начать</button>
  </div>
</div></div>

<script>
const DATA = /*DATA*/;
const VOWELS = 'аеёиоуыэюя';
const TABS = {
  udar:   { title: 'Ударения',    lead: 'Нажми на гласную, на которую падает ударение, потом проверь себя.', ask: 'Нажми на ударную гласную' },
  prepri: { title: 'Пре- и при-', lead: 'Выбери букву приставки: «е» или «и».', ask: 'Какая буква в приставке?' },
  slov:   { title: 'Словарные',   lead: 'Вставь пропущенные гласные. Печатать не нужно: буквы на кнопках.', ask: 'Вставь пропущенные буквы' },
};
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const store = {
  get(k, d) { try { const v = localStorage.getItem('egeru_' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('egeru_' + k, JSON.stringify(v)); } catch (e) {} },
};

// ---------- данные ----------
DATA.udar.forEach(c => c.id = c.w + '|' + c.s + '|' + c.p);
DATA.prepri.forEach(c => c.id = c.w);
DATA.slov.forEach(c => c.id = c.w + (c.c || ''));

// ---------- настройки и прогресс ----------
const saved = store.get('settings', {});
const S = {
  tab: TABS[saved.tab] ? saved.tab : 'udar',
  udar:   Object.assign({ pos: DATA.pos.map((_, i) => i), cnt: 0, repeat: true }, saved.udar),
  prepri: Object.assign({ cnt: 0, repeat: true }, saved.prepri),
  slov:   Object.assign({ cnt: 0, repeat: true, hard: false }, saved.slov),
};
const STATS = Object.assign({ udar: {}, prepri: {}, slov: {} }, store.get('stats', {}));
const save = () => { store.set('settings', S); store.set('stats', STATS); };
// выучено = в последний раз слово названо верно с первой попытки
const learned = (tab, c) => { const s = STATS[tab][c.id]; return !!s && s.l.length > 0 && !!s.l[s.l.length - 1]; };

function poolOf(tab) {
  return tab === 'udar' ? DATA.udar.filter(c => S.udar.pos.includes(c.p)) : DATA[tab];
}
function countOptions(tab, n) {
  let opts;
  if (tab === 'udar') opts = [[.1, '10%'], [.25, '25%'], [.5, '50%'], [1, 'все']].map(([f, l]) => [Math.max(1, Math.round(n * f)), l]);
  else if (tab === 'prepri') opts = [[15, ''], [30, ''], [n, 'все']];
  else opts = [[25, ''], [50, ''], [100, ''], [n, 'все']];
  return opts.filter(([v], i) => i === opts.length - 1 || v < n);
}

// ---------- отрисовка слова ----------
// ударения: mode 'ask' — гласные-кнопки; иначе готовое слово со знаком ударения
function udarHTML(c, opts = {}) {
  let n = 0;
  return [...c.w].map((ch, i) => {
    if (!VOWELS.includes(ch)) return `<span class="k">${esc(ch)}</span>`;
    const cls = ['v'];
    if (opts.sel === i || opts.show === i) cls.push('acc');
    if (opts.right === i) cls.push('acc', 'ok');
    if (opts.wrong === i) cls.push('acc', 'bad');
    n++;
    return opts.buttons ? `<button class="${cls.join(' ')}" data-i="${i}" aria-label="Гласная ${n}: ${esc(ch)}" aria-pressed="${opts.sel === i}">${esc(ch)}</button>`
                        : `<span class="${cls.join(' ')}">${esc(ch)}</span>`;
  }).join('');
}
// слова с пропусками: gaps — индексы, fill(j) → {ch, cls} для j-го пропуска
function gapHTML(w, gaps, fill) {
  const m = w.match(/^(\(.*?\)\s*)(.*)$/);           // «(знаки) препинания»: пояснение мельче
  const off = m ? m[1].length : 0;
  let out = m ? `<span class="par">${esc(m[1])}</span>` : '';
  [...w].forEach((ch, i) => {
    if (i < off) return;
    const j = gaps.indexOf(i);
    if (j < 0) { out += esc(ch); return; }
    const f = fill(j, ch);
    out += f.tag === 'b' ? `<b>${esc(f.ch)}</b>` : `<span class="slot ${f.cls || ''}" data-j="${j}">${f.ch ? esc(f.ch) : '&nbsp;'}</span>`;
  });
  return out;
}
const gapsOf = (tab, c) => tab === 'prepri' ? [c.g] : c.g;
const answerHTML = (tab, c) => tab === 'udar' ? udarHTML(c, { right: c.s }) : gapHTML(c.w, gapsOf(tab, c), (j, ch) => ({ tag: 'b', ch }));

// ---------- главная ----------
function renderHome() {
  const tab = S.tab, T = TABS[tab], st = S[tab];
  document.querySelectorAll('#tabs button').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === tab));
  // пример
  if (tab === 'udar') { const c = DATA.udar.find(x => x.w === 'звонит') || DATA.udar[0]; $('sample').innerHTML = udarHTML(c, { show: c.s }); }
  else if (tab === 'prepri') { const c = DATA.prepri.find(x => x.w === 'президент') || DATA.prepri[0]; $('sample').innerHTML = gapHTML(c.w, [c.g], (j, ch) => ({ ch })); }
  else { const c = DATA.slov.find(x => x.w === 'абонемент') || DATA.slov[0]; $('sample').innerHTML = gapHTML(c.w, c.g, (j, ch) => j === 0 ? { ch } : { ch: '', cls: 'on' }); }
  $('lead').textContent = T.lead;
  // части речи
  $('posBlock').hidden = tab !== 'udar';
  if (tab === 'udar') {
    $('chips').innerHTML = DATA.pos.map((name, i) =>
      `<button class="chip" data-p="${i}" aria-pressed="${st.pos.includes(i)}">${esc(name)} <small>${DATA.udar.filter(c => c.p === i).length}</small></button>`).join('');
    $('posAll').textContent = st.pos.length === DATA.pos.length ? 'Снять все' : 'Выбрать все';
  }
  const pool = poolOf(tab), all = DATA[tab];
  // количество
  const opts = countOptions(tab, pool.length);
  if (st.cnt >= opts.length) st.cnt = opts.length - 1;
  $('cnt').innerHTML = pool.length ? opts.map(([v, l], i) => `<button data-i="${i}" aria-pressed="${st.cnt === i}"><b>${v}</b><small>${l}</small></button>`).join('')
                                   : '<p class="lead" style="margin:0">Выбери хотя бы одну часть речи.</p>';
  // статистика
  let r = 0, w = 0; Object.values(STATS[tab]).forEach(s => { r += s.r; w += s.w; });
  $('stats').innerHTML = `Выучено <b>${all.filter(c => learned(tab, c)).length}</b> из ${all.length}` + (r + w ? `, точность <b>${Math.round(100 * r / (r + w))}%</b>` : '');
  $('swRepeat').setAttribute('aria-checked', st.repeat);
  $('swHard').hidden = tab !== 'slov';
  $('swHard').setAttribute('aria-checked', !!S.slov.hard);
  $('main').textContent = 'Начать'; $('main').disabled = !pool.length;
  $('back').hidden = true; $('keys').hidden = true;
}
$('tabs').onclick = e => { const b = e.target.closest('button'); if (!b) return; S.tab = b.dataset.tab; save(); renderHome(); };
$('chips').onclick = e => {
  const b = e.target.closest('.chip'); if (!b) return; const i = +b.dataset.p, st = S.udar;
  st.pos = st.pos.includes(i) ? st.pos.filter(x => x !== i) : [...st.pos, i].sort((a, b) => a - b); save(); renderHome();
};
$('posAll').onclick = () => { S.udar.pos = S.udar.pos.length === DATA.pos.length ? [] : DATA.pos.map((_, i) => i); save(); renderHome(); };
$('cnt').onclick = e => { const b = e.target.closest('button'); if (!b) return; S[S.tab].cnt = +b.dataset.i; save(); renderHome(); };
$('swRepeat').onclick = () => { S[S.tab].repeat = !S[S.tab].repeat; save(); renderHome(); };
$('swHard').onclick = () => { S.slov.hard = !S.slov.hard; save(); renderHome(); };
$('reset').onclick = e => {
  const b = e.currentTarget;
  if (b.dataset.sure) { STATS[S.tab] = {}; save(); delete b.dataset.sure; b.textContent = 'Сбросить прогресс'; renderHome(); }
  else { b.dataset.sure = 1; b.textContent = `Нажми ещё раз — сбросить «${TABS[S.tab].title}»`; setTimeout(() => { delete b.dataset.sure; b.textContent = 'Сбросить прогресс'; }, 3500); }
};

// ---------- тема ----------
function applyTheme(t) {
  document.documentElement.dataset.theme = t;
  document.querySelector('meta[name=theme-color]').content = t === 'dark' ? '#0f1115' : '#ffffff';
  $('themeBtn').setAttribute('aria-label', t === 'dark' ? 'Включить светлую тему' : 'Включить тёмную тему');
}
$('themeBtn').onclick = () => { const t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'; store.set('theme', t); applyTheme(t); };
applyTheme(document.documentElement.dataset.theme);

// ---------- тест ----------
let Q = null;
function start(list) {
  const tab = S.tab;
  if (!list) {
    const pool = poolOf(tab), n = countOptions(tab, pool.length)[S[tab].cnt][0];
    // случайный порядок без повторов; ещё не выученные слова попадают в выборку первыми
    list = shuffle(pool.slice()).sort((a, b) => learned(tab, a) - learned(tab, b)).slice(0, n);
    shuffle(list);
  }
  Q = { tab, list: list.map(c => ({ c })), i: 0, right: 0, total: list.length, wrongs: [] };
  show('quiz'); renderQ();
}
function renderQ() {
  const item = Q.list[Q.i], c = item.c, tab = Q.tab;
  Q.done = false; Q.sel = null; Q.ans = tab === 'udar' ? null : gapsOf(tab, c).map(() => null); Q.active = 0;
  $('progBar').style.width = (100 * Q.i / Q.list.length) + '%';
  $('progTxt').textContent = `${Q.i + 1} / ${Q.list.length}`;
  $('kick').textContent = item.again ? 'Повтор: здесь была ошибка' : tab === 'udar' ? DATA.pos[c.p] : TABS[tab].title;
  $('kick').className = 'kick' + (item.again ? ' again' : '');
  $('ctx').textContent = c.c || '';
  $('fb').className = 'fb'; $('fb').innerHTML = `<p class="ask">${TABS[tab].ask}</p>`;
  $('word').classList.remove('shake');
  drawWord(); drawKeys();
  $('main').textContent = 'Проверить'; $('main').disabled = true; $('back').hidden = true;
  window.scrollTo(0, 0);
}
function drawWord() {
  const c = Q.list[Q.i].c, tab = Q.tab, el = $('word');
  if (tab === 'udar') el.innerHTML = udarHTML(c, { buttons: true, sel: Q.sel });
  else el.innerHTML = gapHTML(c.w, gapsOf(tab, c), j => ({ ch: Q.ans[j] || '', cls: j === Q.active && (Q.ans.length > 1 || Q.ans[j] == null) ? 'on' : '' }));
  fit(el);
}
function fit(el) {           // длинные слова уменьшаются, чтобы поместиться в строку
  let size = 60; el.style.fontSize = size + 'px';
  while (el.scrollWidth > el.clientWidth && size > 22) { size -= 2; el.style.fontSize = size + 'px'; }
}
function keyLetters() {
  const c = Q.list[Q.i].c;
  if (Q.tab === 'prepri') return ['е', 'и'];
  if (S.slov.hard) return [...VOWELS];
  return [...c.o[Q.active]];
}
function drawKeys() {
  const box = $('keys');
  if (Q.tab === 'udar') { box.hidden = true; box.innerHTML = ''; return; }
  const letters = keyLetters();
  box.hidden = false; box.className = 'keys' + (letters.length > 2 ? ' many' : '');
  box.innerHTML = letters.map(l => `<button class="key" data-l="${l}" aria-pressed="${Q.ans[Q.active] === l}">${l}</button>`).join('');
}
function pickVowel(i) {
  if (Q.done) return;
  Q.sel = i; drawWord(); $('main').disabled = false;
}
function pickLetter(l) {
  if (Q.done || !keyLetters().includes(l)) return;
  Q.ans[Q.active] = l;
  const next = Q.ans.findIndex((a, j) => a == null && j > Q.active), any = Q.ans.indexOf(null);
  if (next >= 0) Q.active = next; else if (any >= 0) Q.active = any;
  drawWord(); drawKeys();
  $('main').disabled = Q.ans.includes(null);
}
$('word').onclick = e => {
  if (!Q || Q.done) return;
  if (Q.tab === 'udar') {            // касание мимо буквы засчитывается ближайшей гласной
    const vs = [...$('word').querySelectorAll('.v')]; if (!vs.length) return;
    const hit = e.target.closest('.v');
    const best = hit || vs.map(v => { const r = v.getBoundingClientRect(); return [Math.abs(e.clientX - (r.left + r.width / 2)), v]; }).sort((a, b) => a[0] - b[0])[0][1];
    pickVowel(+best.dataset.i);
    const again = $('word').querySelector(`.v[data-i="${Q.sel}"]`); if (hit && again) again.focus({ preventScroll: true });
  } else {
    const s = e.target.closest('.slot'); if (!s) return;
    Q.active = +s.dataset.j; drawWord(); drawKeys();
  }
};
$('keys').onclick = e => { const b = e.target.closest('.key'); if (b) pickLetter(b.dataset.l); };

function check() {
  const item = Q.list[Q.i], c = item.c, tab = Q.tab;
  const gaps = tab === 'udar' ? null : gapsOf(tab, c);
  const ok = tab === 'udar' ? Q.sel === c.s : gaps.every((g, j) => Q.ans[j] === c.w[g]);
  Q.done = true;
  // слово
  if (tab === 'udar') $('word').innerHTML = udarHTML(c, ok ? { right: c.s } : { right: c.s, wrong: Q.sel });
  else $('word').innerHTML = gapHTML(c.w, gaps, (j, ch) => ({ ch: Q.ans[j], cls: Q.ans[j] === ch ? 'ok' : 'bad' }));
  if (!ok) { void $('word').offsetWidth; $('word').classList.add('shake'); }
  // кнопки-буквы
  if (gaps && gaps.length > 1) $('keys').hidden = true;
  else if (gaps) $('keys').querySelectorAll('.key').forEach(k => {
    k.disabled = true; k.setAttribute('aria-pressed', 'false');
    if (k.dataset.l === c.w[gaps[0]]) k.classList.add('ok'); else if (k.dataset.l === Q.ans[0]) k.classList.add('bad');
  });
  // пояснение
  let html = `<p class="verdict">${ok ? 'Верно' : 'Неверно'}</p>`;
  if (!ok) html += tab === 'udar' ? `<p class="note">Ударение падает на «${esc(c.w[c.s])}»</p>` : `<p class="right word">${answerHTML(tab, c)}</p>`;
  const notes = [];
  if (tab === 'udar') { if (c.r) notes.push(esc(c.r)); if (c.x) notes.push(esc(c.x)); }
  if (tab === 'slov' && c.d) notes.push('<span class="word">' + c.d.map(d => gapHTML(d.w, d.g, (j, ch) => ({ tag: 'b', ch }))).join(', ') + '</span>');
  if (notes.length) html += `<p class="note">${notes.join('<br>')}</p>`;
  if (!ok && S[tab].repeat) html += `<p class="note">Слово вернётся через несколько слов.</p>`;
  $('fb').className = 'fb ' + (ok ? 'ok' : 'bad'); $('fb').innerHTML = html;
  // прогресс
  const st = STATS[tab][c.id] = STATS[tab][c.id] || { r: 0, w: 0, l: [] };
  if (!item.again) { ok ? st.r++ : st.w++; st.l = [...st.l, ok ? 1 : 0].slice(-3); }
  if (ok) { if (!item.again) Q.right++; }
  else {
    if (!Q.wrongs.includes(c)) Q.wrongs.push(c);
    if (S[tab].repeat) Q.list.splice(Math.min(Q.list.length, Q.i + 3 + (Math.random() * 3 | 0)), 0, { c, again: true });
  }
  save();
  $('progBar').style.width = (100 * (Q.i + 1) / Q.list.length) + '%';
  $('progTxt').textContent = `${Q.i + 1} / ${Q.list.length}`;
  $('main').textContent = Q.i + 1 < Q.list.length ? 'Далее' : 'Результат'; $('main').disabled = false;
}
function next() { Q.i++; Q.i < Q.list.length ? renderQ() : results(); }
function results() {
  show('result');
  $('rTitle').textContent = TABS[Q.tab].title;
  const all = Q.right === Q.total;
  $('score').innerHTML = `${Q.right} из ${Q.total}<small>${all ? 'Все слова с первого раза, без единой ошибки.' : 'столько слов верно с первого раза'}</small>`;
  $('miss').hidden = !Q.wrongs.length;
  $('missList').innerHTML = Q.wrongs.map(c => `<li><span class="word">${answerHTML(Q.tab, c)}</span>${c.c ? `<span class="c">${esc(c.c)}</span>` : ''}</li>`).join('');
  $('main').textContent = Q.wrongs.length ? `Повторить ошибки: ${Q.wrongs.length}` : 'Пройти ещё раз'; $('main').disabled = false;
  $('back').hidden = false; $('keys').hidden = true;
  window.scrollTo(0, 0);
}
function show(id) { ['home', 'quiz', 'result'].forEach(s => $(s).hidden = s !== id); }
function goHome() { Q = null; show('home'); renderHome(); window.scrollTo(0, 0); }
$('main').onclick = () => {
  if (!$('home').hidden) return start();
  if (!$('quiz').hidden) return Q.done ? next() : check();
  return Q.wrongs.length ? start(shuffle(Q.wrongs.slice())) : start();
};
$('back').onclick = goHome; $('quit').onclick = goHome;

// ---------- клавиатура ----------
const LAT = { f: 'а', t: 'е', '`': 'ё', b: 'и', j: 'о', e: 'у', s: 'ы', "'": 'э', '.': 'ю', z: 'я' };
document.addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === 'Enter') { if (!$('main').disabled && document.activeElement !== $('main')) { e.preventDefault(); $('main').click(); } return; }
  if (!Q || $('quiz').hidden || Q.done) return;
  if (e.key === 'Escape') return goHome();
  const c = Q.list[Q.i].c;
  if (Q.tab === 'udar') {
    const vs = [...c.w].map((ch, i) => VOWELS.includes(ch) ? i : -1).filter(i => i >= 0);
    let k = vs.indexOf(Q.sel);
    if (e.key === 'ArrowRight') k = Math.min(vs.length - 1, k + 1);
    else if (e.key === 'ArrowLeft') k = k < 0 ? vs.length - 1 : Math.max(0, k - 1);
    else if (/^[1-9]$/.test(e.key) && +e.key <= vs.length) k = +e.key - 1;
    else return;
    e.preventDefault(); pickVowel(vs[k]);
  } else {
    const l = e.key.toLowerCase(), ch = VOWELS.includes(l) ? l : LAT[l];
    if (ch) pickLetter(ch);
    else if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { Q.active = Math.max(0, Math.min(Q.ans.length - 1, Q.active + (e.key === 'ArrowRight' ? 1 : -1))); drawWord(); drawKeys(); }
  }
});
addEventListener('resize', () => { if (Q && !$('quiz').hidden) fit($('word')); });
if (window.ResizeObserver) new ResizeObserver(() => document.documentElement.style.setProperty('--bar-h', $('bar').offsetHeight + 'px')).observe($('bar'));
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (Q && !$('quiz').hidden) fit($('word')); });

renderHome();
if ('serviceWorker' in navigator && location.protocol === 'https:') { try { navigator.serviceWorker.register('sw.js').catch(() => {}); } catch (e) {} }
</script>
</body>
